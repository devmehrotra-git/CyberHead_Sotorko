name: Sotorko regression tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Full pytest suite
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete pytest suite
        run: python -m pytest -vv -p no:cacheprovider
